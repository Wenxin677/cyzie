<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Cyzie module diagnostics</title>
<style>body{font:13px/1.5 Consolas,monospace;padding:16px} .ok{color:#14715c} .bad{color:#a13a2c;font-weight:700}</style>
</head>
<body>
<h1>Cyzie module diagnostics</h1>
<pre id="out">running…</pre>
<script type="module">
const out = document.getElementById('out');
const lines = [];
const log = (ok, name, detail = '') => { lines.push(`${ok ? 'OK  ' : 'FAIL'} ${name}${detail ? ' :: ' + detail : ''}`); out.textContent = lines.join('\n'); };

window.addEventListener('error', e => log(false, 'window error', e.message));
window.addEventListener('unhandledrejection', e => log(false, 'unhandled rejection', e.reason?.message || String(e.reason)));

const modules = [
  'js/nlp.js', 'js/zip.js', 'js/parse-pptx.js', 'js/parse-pdf.js', 'js/parse-text.js',
  'js/extract.js', 'js/questions.js', 'js/grade.js', 'js/retrieve.js', 'js/tutor.js',
  'js/markdown.js', 'js/store.js', 'js/sample.js',
];
const loaded = {};
for (const m of modules) {
  try {
    loaded[m] = await import(`../${m}?diag=${Date.now()}`);
    log(true, m);
  } catch (err) {
    log(false, m, `${err.name}: ${err.message}`);
  }
}

try {
  const { parseText } = loaded['js/parse-text.js'];
  const { analyzeDeck } = loaded['js/extract.js'];
  const { createSession, start, respond } = loaded['js/tutor.js'];
  const deck = analyzeDeck(parseText('# A\n\nBit: a single binary digit, zero or one.\n\n# B\n\nByte: eight bits of data in a row.\n'));
  const session = createSession(deck, { seed: 'diag' });
  const out1 = start(session);
  log(true, 'tutor runs in the browser', `${out1.messages.length} messages, awaiting=${session.awaiting}`);
  const out2 = respond(session, 'next');
  log(true, 'tutor advanced a slide', `slide=${session.slide}, ${out2.messages.length} messages`);
} catch (err) {
  log(false, 'tutor smoke test', `${err.name}: ${err.message}`);
}

try {
  const { openZip } = loaded['js/zip.js'];
  const res = await fetch('../tests/fixtures/sample.pptx');
  const buf = await res.arrayBuffer();
  const zip = await openZip(buf);
  log(zip.names.length > 5, 'zip reader opens the .pptx fixture', `${zip.names.length} entries`);
  const { parsePptx } = loaded['js/parse-pptx.js'];
  const parsed = await parsePptx(buf);
  log(parsed.slides.length === 3, 'pptx parser reads the fixture', `${parsed.slides.length} slides`);
} catch (err) {
  log(false, 'pptx parse in browser', `${err.name}: ${err.message}`);
}

try {
  const res = await fetch('../tests/fixtures/../fixtures/sample-notes.md');
  const t = await res.text();
  log(t.length > 50, 'fixture files are served', `${t.length} chars`);
} catch (err) {
  log(false, 'fixture fetch', `${err.name}: ${err.message}`);
}

try {
  const { openDb } = loaded['js/store.js'];
  const db = await openDb();
  log(!!db, 'IndexedDB opens', [...db.objectStoreNames].join(','));
} catch (err) {
  log(false, 'IndexedDB', `${err.name}: ${err.message}`);
}

// Report what the app itself says when loaded in an iframe.
const frame = document.createElement('iframe');
frame.style.cssText = 'width:1100px;height:520px;border:1px solid #999;margin-top:10px';
frame.src = `../index.html?instant=1&diag=${Date.now()}`;
document.body.appendChild(frame);
await new Promise(r => setTimeout(r, 4000));
try {
  const w = frame.contentWindow;
  const hasApp = !!w.CyzieApp?.state;
  log(hasApp, 'index.html boots and exposes CyzieApp');
  if (!hasApp) {
    log(false, 'app body text', (w.document.body.innerText || '').slice(0, 500).replace(/\n+/g, ' | '));
  } else {
    log(true, 'app state', `lessons=${w.CyzieApp.state.lessons.length} lesson=${w.CyzieApp.state.lesson?.name || 'none'}`);
  }
} catch (err) {
  log(false, 'iframe app boot', `${err.name}: ${err.message}`);
}

// Storage-blocked mode (private windows).
try {
  const noStore = document.createElement('iframe');
  noStore.style.cssText = 'width:1100px;height:420px;border:1px solid #999;margin-top:10px';
  noStore.src = `../index.html?instant=1&nostore=1&diag=${Date.now()}`;
  document.body.appendChild(noStore);
  await new Promise(r => setTimeout(r, 5000));
  const w = noStore.contentWindow;
  log(!!w.CyzieApp?.state, 'app boots with storage blocked');
  if (w.CyzieApp?.state) {
    w.CyzieApp.loadSample();
    await new Promise(r => setTimeout(r, 4000));
    log(w.document.querySelectorAll('.msg').length > 2, 'lesson runs with storage blocked', `${w.document.querySelectorAll('.msg').length} messages`);
  } else {
    log(false, 'nostore body text', (w.document.body.innerText || '').slice(0, 400).replace(/\n+/g, ' | '));
  }
} catch (err) {
  log(false, 'nostore iframe', `${err.name}: ${err.message}`);
}

// Warm-template boot also needs to work.
try {
  const fresh = document.createElement('iframe');
  fresh.style.cssText = 'width:1100px;height:520px;border:1px solid #999;margin-top:10px';
  fresh.src = `../index.html?instant=1&fresh=1&diag=${Date.now()}`;
  document.body.appendChild(fresh);
  await new Promise(r => setTimeout(r, 4000));
  const w = fresh.contentWindow;
  log(!!w.CyzieApp?.state, 'app boots on the home screen (?fresh=1)');
  log(/Good |Still up/.test(w.document.querySelector('#welcomeGreeting')?.textContent || ''), 'home greeting is set', w.document.querySelector('#welcomeGreeting')?.textContent);
} catch (err) {
  log(false, 'fresh iframe', `${err.name}: ${err.message}`);
}

// Upload probe: does the .pptx fixture ingest end-to-end in the browser?
try {
  const probe = document.createElement('iframe');
  probe.style.cssText = 'width:1100px;height:400px;border:1px solid #999;margin-top:10px';
  probe.src = `../index.html?instant=1&fresh=1&diag=${Date.now()}`;
  document.body.appendChild(probe);
  await new Promise(r => setTimeout(r, 3000));
  const w = probe.contentWindow;
  const buf = await (await fetch('../tests/fixtures/sample.pptx')).arrayBuffer();
  const file = new w.File([buf], 'sample.pptx', { type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' });
  log(file.size > 1000, 'probe: fixture file built', `${file.size} bytes`);
  w.CyzieApp.ingestFile(file);
  await new Promise(r => setTimeout(r, 5000));
  const lesson = w.CyzieApp.state.lesson;
  log(lesson?.fileName === 'sample.pptx', 'probe: .pptx ingested', lesson ? `${lesson.fileName} · ${lesson.deck?.slides.length} slides` : 'no lesson');
  const notices = [...w.document.querySelectorAll('.notice')].map(n => n.textContent.trim());
  log(notices.length === 0, 'probe: no error notice', notices.join(' | ').slice(0, 300));
  log(w.document.querySelectorAll('.msg').length > 2, 'probe: chat rendered', `${w.document.querySelectorAll('.msg').length} messages`);
  log(!!w.document.querySelector('.code-block, .slide-card-chat'), 'probe: slide card rendered');
} catch (err) {
  log(false, 'upload probe', `${err.name}: ${err.message}`);
}

// Demo probe: ?demo=1 must leave the header and the context panel describing the open lesson.
try {
  const demo = document.createElement('iframe');
  demo.style.cssText = 'width:1100px;height:400px;border:1px solid #999;margin-top:10px';
  demo.src = `../index.html?demo=1&diag=${Date.now()}`;
  document.body.appendChild(demo);
  await new Promise(r => setTimeout(r, 6000));
  const dw = demo.contentWindow;
  const dd = dw.document;
  const header = dd.querySelector('#lessonTitle')?.textContent?.trim() || '';
  const sub = dd.querySelector('#slideIndicator')?.textContent?.trim() || '';
  const panelEmptyVisible = !dd.querySelector('#panelEmpty')?.hidden;
  const panelBodyVisible = !dd.querySelector('#panelBody')?.hidden;
  const slideTitle = dd.querySelector('#slideCardTitle')?.textContent?.trim() || '';
  log(header && header !== 'No lesson loaded', 'demo: header names the open lesson', header);
  log(!!sub, 'demo: header shows slide position', sub);
  log(!panelEmptyVisible && panelBodyVisible, 'demo: context panel shows the lesson', `empty=${panelEmptyVisible} body=${panelBodyVisible}`);
  log(!!slideTitle && slideTitle !== '—', 'demo: context panel has the slide', slideTitle);
  log(dd.querySelectorAll('.msg').length > 2, 'demo: lesson messages rendered', `${dd.querySelectorAll('.msg').length} messages`);
} catch (err) {
  log(false, 'demo probe', `${err.name}: ${err.message}`);
}

const failures = lines.filter(l => l.startsWith('FAIL'));
document.title = failures.length ? 'DIAG FAIL' : 'DIAG OK';
// Report to disk too, so the headless runner can collect this page like the other harnesses.
try {
  await fetch('/report/diag', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ total: lines.length, passed: lines.length - failures.length, failed: failures, checks: lines }),
  });
} catch { /* reporting is best effort */ }
</script>
</body>
</html>
