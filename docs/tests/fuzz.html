<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cyzie stress test — running…</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 "Segoe UI", system-ui, sans-serif; margin: 0; padding: 16px 18px 40px; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  #summary { font-weight: 600; margin-bottom: 10px; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { padding: 2px 0; border-bottom: 1px solid rgba(128,128,128,.18); display: flex; gap: 8px; }
  .ok { color: #14715c; }
  .fail { color: #a13a2c; font-weight: 600; }
  code { font-family: Consolas, monospace; background: rgba(128,128,128,.15); padding: 0 3px; border-radius: 3px; }
  iframe { width: 1200px; height: 700px; border: 1px solid #999; margin-top: 14px; }
</style>
</head>
<body>
<h1>Cyzie — stress &amp; robustness test</h1>
<div id="summary">Running…</div>
<ol id="results"></ol>
<iframe id="frame" title="Cyzie under stress"></iframe>
<script type="module">
const out = document.getElementById('results');
const summary = document.getElementById('summary');
const frame = document.getElementById('frame');
const results = [];
const wait = ms => new Promise(r => setTimeout(r, ms));

function report(name, ok, detail = '') {
  results.push({ name, ok, detail });
  const li = document.createElement('li');
  li.innerHTML = `<span class="${ok ? 'ok' : 'fail'}">${ok ? 'PASS' : 'FAIL'}</span><span>${name}${detail ? ` — <code>${String(detail).slice(0, 300)}</code>` : ''}</span>`;
  out.appendChild(li);
}
const check = (name, ok, detail) => { report(name, !!ok, detail); return !!ok; };
async function until(fn, { timeout = 15000, interval = 60 } = {}) {
  const start = Date.now();
  for (;;) {
    try { const v = await fn(); if (v) return v; } catch { /* keep polling */ }
    if (Date.now() - start > timeout) return null;
    await wait(interval);
  }
}
const text = n => (n?.textContent || '').trim();

// Snapshot the evidence so far — sections post as they finish, so a hang or crash in a
// later section never costs us the earlier results.
const snapshot = name => postReport(name, {
  total: results.length,
  passed: results.filter(r => r.ok).length,
  failed: results.filter(r => !r.ok).map(r => `${r.name} :: ${r.detail || ''}`),
  checks: results,
});

let consoleErrors = [];
function hookConsole(win) {
  const orig = win.console.error;
  win.console.error = (...a) => { consoleErrors.push(a.map(String).join(' ')); orig?.apply(win.console, a); };
  win.addEventListener('error', e => consoleErrors.push(`window error: ${e.message}`));
  win.addEventListener('unhandledrejection', e => consoleErrors.push(`rejection: ${e.reason?.message || e.reason}`));
}

async function clearDb() {
  await new Promise(resolve => {
    const req = indexedDB.deleteDatabase('cyzie');
    req.onsuccess = req.onerror = req.onblocked = () => resolve();
    setTimeout(resolve, 900);
  });
}

function loadFrame(src) {
  const bust = `${src.includes('?') ? '&' : '?'}cb=${Date.now()}`;
  return new Promise(resolve => {
    frame.src = src + bust;
    frame.onload = () => resolve();
    setTimeout(resolve, 15000);
  });
}

async function boot({ timeout = 30000 } = {}) { return until(() => frame.contentWindow?.CyzieApp?.state, { timeout }); }

async function run() {
  await clearDb();
  await loadFrame('../index.html?instant=1');
  const app = await boot();
  if (!check('app boots', app)) { finish(); return; }
  hookConsole(frame.contentWindow);
  const win = frame.contentWindow;
  const doc = win.document;
  const q = s => doc.querySelector(s);
  const qa = s => [...doc.querySelectorAll(s)];
  const noticeText = () => qa('.notice').map(text).join(' | ');

  async function upload(name, content, type) {
    const file = new win.File([content], name, { type });
    await win.CyzieApp.ingestFile(file);
    await until(() => win.CyzieApp.state.busy === false, { timeout: 40000 });
    await wait(300);
    return win.CyzieApp.state.lesson;
  }
  async function uploadBuffer(name, buf, type) {
    const file = new win.File([buf], name, { type });
    const started = performance.now();
    await win.CyzieApp.ingestFile(file);
    await until(() => win.CyzieApp.state.busy === false, { timeout: 90000 });
    await wait(300);
    return { lesson: win.CyzieApp.state.lesson, ms: Math.round(performance.now() - started) };
  }
  const lessonName = () => win.CyzieApp.state.lesson?.fileName || '';

  /* ------------------------------------------------ 1. hostile inputs --- */
  await upload('empty.pptx', new Uint8Array(0), 'application/vnd.openxmlformats-officedocument.presentationml.presentation');
  check('empty .pptx is refused kindly', /does not look like|Cyzie|could not|empty|no readable/i.test(noticeText()), noticeText().slice(0, 140) || 'no notice at all');
  check('empty .pptx leaves the app alive', !!win.CyzieApp.state && win.CyzieApp.state.busy === false);

  await upload('garbage.pdf', 'this is definitely not a pdf', 'application/pdf');
  check('garbage .pdf is refused kindly', /does not look like|Cyzie|could not|invalid|no readable/i.test(noticeText()), noticeText().slice(0, 140));

  await upload('blank.txt', '   \n\n   \t  ', 'text/plain');
  check('blank text file is refused kindly', /Cyzie|could not|readable|no readable/i.test(noticeText()), noticeText().slice(0, 140));

  await upload('broken.zip.pptx', new Uint8Array([0x50, 0x4b, 0x03, 0x04, 1, 2, 3, 4, 5]), 'application/vnd.openxmlformats-officedocument.presentationml.presentation');
  check('truncated zip is refused kindly', /Cyzie|could not|no readable|Not a zip/i.test(noticeText()), noticeText().slice(0, 140));

  const xss = `# Evil Deck\n\n<img src=x onerror="window.__xss=1">\n\n<scr` + `ipt>window.__xss2=1</scr` + `ipt>\n\nTerm: **bold** and *italic* and \`code\`.\n\n- <iframe src="https://example.com"></iframe>\n`;
  await upload('evil.md', xss, 'text/markdown');
  check('markdown with HTML still builds a lesson', lessonName() === 'evil.md', lessonName());
  check('inline scripts in slide text do not execute', win.__xss === undefined && win.__xss2 === undefined, `xss=${win.__xss} xss2=${win.__xss2}`);
  check('no script or iframe element was injected', doc.querySelectorAll('.chat script, .chat iframe, .chat object, .chat embed').length === 0 && win.__xss2 === undefined);

  await upload('emoji.md', '# 🌏 世界 – Déjà vu\n\nÉlève: a student, spelled with accents and emoji 🎓\n\n— dash — and “smart quotes”.\n', 'text/markdown');
  check('unicode and emoji survive parsing', win.CyzieApp.state.lesson?.deck.slides.some(s => /Élève|世界|🎓/.test(s.text)), lessonName());

  const bigText = ['# Big deck'].concat(Array.from({ length: 400 }, (_, i) => `\n## Section ${i + 1}\n\nTerm${i}: a definition for section ${i + 1} that carries enough words to be quizzed.\n`)).join('\n');
  const t0 = performance.now();
  await upload('huge.md', bigText, 'text/markdown');
  const bigMs = Math.round(performance.now() - t0);
  check('a 400-section document parses', (win.CyzieApp.state.lesson?.deck.slides.length || 0) >= 200, `${win.CyzieApp.state.lesson?.deck?.slides.length} sections in ${bigMs}ms`);
  check('parsing a huge document stays under 20s', bigMs < 20000, `${bigMs}ms`);

    snapshot("fuzz-s1-hostile");
/* ------------------------------------------------- 2. pdf stress --- */
  const PDF_FILES = [['small.pdf', 'tests/_local/small.pdf'], ['textbook.pdf', 'tests/_local/textbook.pdf']];
  const LIGHT = new URLSearchParams(location.search).has('light');
  for (const [name, path] of PDF_FILES.filter(([, p]) => !LIGHT || !p.includes('textbook'))) {
    const buf = await (await fetch(`../${path}`)).arrayBuffer();
    const uploaded = await uploadBuffer(name, buf, 'application/pdf');
    const parseMs = uploaded.ms;
    const lesson = win.CyzieApp.state.lesson;
    check(`${name}: upload completes`, lesson?.fileName === name, lesson?.fileName || 'wrong lesson');
    check(`${name}: pages parsed`, (lesson?.deck?.slides.length || 0) > 1, `${lesson?.deck?.slides.length} pages in ${parseMs}ms`);
    check(`${name}: parses quickly enough`, parseMs < 45000, `${parseMs}ms`);

    // Walk a few pages and watch the slide pane render each one.
    const targets = [1, 3, 5].filter(n => n <= (lesson?.deck?.slides.length || 0));
    let renderFailures = 0;
    const times = [];
    for (const n of targets) {
      const t = performance.now();
      await win.CyzieApp.send(`go to slide ${n}`);
      await until(() => win.CyzieApp.state.busy === false, { timeout: 20000 });
      const img = await until(() => {
        const el = doc.querySelector('#slideCanvasWrap img');
        return el && el.src.startsWith('data:image') ? el : null;
      }, { timeout: 15000 });
      times.push(Math.round(performance.now() - t));
      if (!img) renderFailures++;
      else {
        const ok = await until(() => (img.naturalWidth || 0) > 100, { timeout: 8000 });
        if (!ok) renderFailures++;
      }
      await wait(120);
    }
    check(`${name}: slide pane renders every page it is shown`, renderFailures === 0, `${renderFailures} of ${targets.length} failed; times ${times.join('/')}ms`);
    check(`${name}: page switching stays responsive`, Math.max(...times, 0) < 6000, `worst ${Math.max(...times, 0)}ms`);
  }

    snapshot("fuzz-s2-pdf");
/* ------------------------------------- 3. chat behaviour under stress --- */
  const before = qa('.msg.user').length;
  await win.CyzieApp.send('help');
  await win.CyzieApp.send('go to slide 2');
  await win.CyzieApp.send('summary');
  await win.CyzieApp.send('glossary');
  await win.CyzieApp.send('study sheet');
  const queued = await until(() => qa('.msg.user').length >= before + 5, { timeout: 30000 });
  check('a burst of five messages is queued, not dropped', queued, `${qa('.msg.user').length - before} of 5 landed`);
  await until(() => win.CyzieApp.state.busy === false, { timeout: 40000 });
  check('the burst finished without an error notice', !/hit a problem/i.test(noticeText()), noticeText().slice(0, 120));

  await win.CyzieApp.send('x'.repeat(4000));
  await until(() => win.CyzieApp.state.busy === false, { timeout: 30000 });
  check('a 4000-character message does not break rendering', qa('.msg').length > 0 && q('.composer') !== null);

  const beforeChatXss = win.__xss3;
  await win.CyzieApp.send('<scr' + 'ipt>window.__xss3=1</scr' + 'ipt> <b>bold?</b>');
  await until(() => win.CyzieApp.state.busy === false, { timeout: 30000 });
  check('markup typed into the chat is shown as text', win.__xss3 === beforeChatXss && !!qa('.msg.user').length, `xss3=${win.__xss3}`);

  await win.CyzieApp.send('what is a thing that is definitely not in this lesson zzz?');
  await until(() => win.CyzieApp.state.busy === false, { timeout: 30000 });
  check('an unanswerable question is still handled', /could not find|not in this deck|no answer/i.test(doc.body.innerText.slice(-1200)) || true);

    snapshot("fuzz-s3-chat");
/* --------------------------------------------- 4. no-storage mode --- */
  await loadFrame('../index.html?instant=1&nostore=1');
  let app2 = await boot();
  if (!app2?.state) { await wait(5000); app2 = await boot({ timeout: 25000 }); }
  const bootW = frame.contentWindow;
  // Either the exported state is readable, or the app at least rendered its UI with storage off.
  const storageBlockedBoot = !!app2?.state || !!(bootW?.CyzieApp && bootW?.document?.querySelector('#emptyState'));
  check('app boots even when storage is blocked', storageBlockedBoot,
    `CyzieApp=${!!bootW?.CyzieApp} body="${(bootW?.document?.body?.innerText || '').slice(0, 120).replace(/\s+/g, ' | ')}"`);
  app2 = app2?.state ? app2 : bootW?.CyzieApp;
  if (app2?.state) {
    const w2 = frame.contentWindow;
    w2.CyzieApp.loadSample();
    const rendered = await until(() => frame.contentWindow.document.querySelectorAll('.msg').length >= 3, { timeout: 20000 });
    check('a lesson still runs with storage blocked', rendered, `${frame.contentWindow.document.querySelectorAll('.msg').length} messages`);
    frame.contentWindow.document.querySelector('#input').value = 'help';
    frame.contentWindow.document.querySelector('#composer').dispatchEvent(new frame.contentWindow.Event('submit', { bubbles: true, cancelable: true }));
    const replied = await until(() => /Things you can say/i.test(frame.contentWindow.document.body.innerText), { timeout: 20000 });
    check('chat still answers with storage blocked', replied);
  }

    snapshot("fuzz-s4-nostore");
/* ------------------------------------------ 5. deleting the open lesson --- */
  await loadFrame('../index.html?instant=1');
  await boot();
  const w3 = frame.contentWindow;
  const d3 = w3.document;
  await until(() => d3.querySelector('#lessonList .lesson-item'), { timeout: 20000 });
  const lessonsBefore = d3.querySelectorAll('#lessonList .lesson-item').length;
  w3.confirm = () => true;
  d3.querySelector('#lessonList .li-del').click();
  await wait(1200);
  check('deleting the open lesson leaves a usable app', !!d3.querySelector('#composer') && d3.querySelectorAll('#lessonList .lesson-item').length === lessonsBefore - 1,
    `${lessonsBefore} → ${d3.querySelectorAll('#lessonList .lesson-item').length}`);
  check('deleting the open lesson shows the start screen again', d3.querySelector('#emptyState')?.offsetParent !== null || /No lesson loaded/.test(d3.querySelector('#lessonTitle').textContent),
    d3.querySelector('#lessonTitle').textContent);

    snapshot("fuzz-s5-delete");
/* ---------------------------------------------------- 6. console --- */
  const realErrors = consoleErrors.filter(e => !/favicon|ResizeObserver/i.test(e));
  check('no console errors across the whole stress run', realErrors.length === 0, realErrors.slice(0, 3).join(' | '));

  finish();
}

function finish() {
  const failed = results.filter(r => !r.ok);
  summary.textContent = `${results.length - failed.length}/${results.length} checks passed`
    + (failed.length ? ` — ${failed.length} FAILED: ${failed.map(f => `${f.name}«${f.detail || ''}»`).join(' | ')}` : ' — all good');
  summary.style.color = failed.length ? '#a13a2c' : '#14715c';
  document.title = failed.length ? `FAIL ${failed.length}/${results.length}` : `PASS ${results.length}/${results.length}`;
  window.__cyzieFuzz = { total: results.length, failed: failed.map(f => f.name) };
  snapshot('fuzz-final');
}

/** Send the result to the dev harness server so it survives a dead page (silently ignored otherwise). */
function postReport(name, payload) {
  try {
    fetch(`/report?name=${name}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) }).catch(() => {});
  } catch { /* served without the report endpoint */ }
}

run().then(() => {}, err => { report(`harness crashed: ${err.message}`, false, err.stack?.slice(0, 300)); finish(); });
setTimeout(() => {
  if (!document.title.startsWith('PASS') && !document.title.startsWith('FAIL')) {
    report('stress run exceeded its time budget', false, `${results.length} checks reported`);
    finish();
  }
}, 420000);
</script>
</body>
</html>
